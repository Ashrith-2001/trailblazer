<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trailblazer Sessions Dashboard</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --card-subtle: #f1f3f5;
      --border: #d0d7de;
      --text: #1f2328;
      --text-muted: #57606a;
      --primary: #0969da;
      --primary-subtle: #ddf4ff;
      --success: #1a7f37;
      --success-subtle: #dafbe1;
      --warning: #9a6700;
      --warning-subtle: #fff8c5;
      --danger: #cf222e;
      --danger-subtle: #ffebe9;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      --radius: 8px;
      --shadow-sm: 0 1px 3px rgba(31,35,40,0.08);
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-subtle: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-subtle: rgba(56, 139, 253, 0.15);
      --success: #3fb950;
      --success-subtle: rgba(46, 160, 67, 0.15);
      --warning: #d29922;
      --warning-subtle: rgba(187, 128, 9, 0.15);
      --danger: #f85149;
      --danger-subtle: rgba(248, 81, 73, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 32px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-filter-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
    }

    .filter-select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .sessions-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .sessions-table th, .sessions-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .sessions-table th {
      background: var(--card-subtle);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sessions-table tr:last-child td {
      border-bottom: none;
    }

    .sessions-table tr:hover td {
      background: var(--card-subtle);
    }

    .issue-cell-title {
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: block;
      margin-bottom: 2px;
    }
    .issue-cell-title:hover { text-decoration: underline; }

    .issue-cell-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-bug { background: var(--danger-subtle); color: var(--danger); }
    .badge-feature { background: var(--primary-subtle); color: var(--primary); }
    .badge-refactor { background: var(--warning-subtle); color: var(--warning); }
    .badge-perf { background: var(--success-subtle); color: var(--success); }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }

    .btn-theme {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="header-title">
        <span>🧭 Trailblazer</span>
        <span style="font-size: 14px; font-weight: normal; color: var(--text-muted);">Session History</span>
      </div>
      <button class="btn-theme" onclick="toggleTheme()">☀️ Toggle Theme</button>
    </div>

    <div class="search-filter-row">
      <input type="text" id="search-input" class="search-input" placeholder="Search by issue #, title, or root cause..." oninput="filterSessions()">
      <select id="category-filter" class="filter-select" onchange="filterSessions()">
        <option value="all">All Categories</option>
        <option value="bug">Bugs</option>
        <option value="flaky-test">Tests</option>
        <option value="feature">Features</option>
        <option value="refactor">Refactors</option>
        <option value="performance">Performance</option>
      </select>
    </div>

    <table class="sessions-table">
      <thead>
        <tr>
          <th style="width: 80px;">Issue</th>
          <th>Investigation Title & Cause</th>
          <th style="width: 120px;">Category</th>
          <th style="width: 140px;">Evidence</th>
          <th style="width: 110px;">Stops</th>
          <th style="width: 100px;">Actions</th>
        </tr>
      </thead>
      <tbody id="sessions-tbody">
        <!-- Rendered by JS -->
      </tbody>
    </table>

    <div id="empty-state" class="empty-state" style="display: none;">
      No matching Trailblazer investigation traces found.
    </div>
  </div>

  <script id="dashboard-raw-data" type="application/json">
/*__DASHBOARD_DATA__*/
  </script>

  <script>
    let sessions = [];
    try {
      const raw = document.getElementById('dashboard-raw-data').textContent.trim();
      if (raw && !raw.includes('__DASHBOARD_DATA__')) {
        sessions = JSON.parse(raw);
      }
    } catch (e) {
      console.warn("Could not load dashboard data", e);
    }

    function renderTable(list) {
      const tbody = document.getElementById('sessions-tbody');
      const emptyState = document.getElementById('empty-state');
      tbody.innerHTML = '';

      if (list.length === 0) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      list.forEach(item => {
        const tr = document.createElement('tr');
        const cat = item.category || 'bug';
        tr.innerHTML = `
          <td><strong>#${item.issueId || ''}</strong></td>
          <td>
            <a class="issue-cell-title" href="${item.reportPath || '#'}">${item.title}</a>
            <div class="issue-cell-desc">${item.rootCause || item.problem || ''}</div>
          </td>
          <td><span class="badge badge-${cat}">${cat}</span></td>
          <td><span style="font-size: 12px; color: var(--text-muted);">${item.evidenceLevel || 'inferred'}</span></td>
          <td><span style="font-size: 12px; color: var(--text-muted);">${item.stopCount || 0} stops</span></td>
          <td>
            <a href="${item.reportPath || '#'}" style="color: var(--primary); font-size: 12px; text-decoration: none; font-weight: 600;">Open Report →</a>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterSessions() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const cat = document.getElementById('category-filter').value;

      const filtered = sessions.filter(s => {
        const matchesQ = !q || (s.title && s.title.toLowerCase().includes(q)) ||
                         (s.issueId && String(s.issueId).toLowerCase().includes(q)) ||
                         (s.problem && s.problem.toLowerCase().includes(q)) ||
                         (s.rootCause && s.rootCause.toLowerCase().includes(q));
        const matchesCat = cat === 'all' || (s.category && s.category.toLowerCase() === cat);
        return matchesQ && matchesCat;
      });

      renderTable(filtered);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTable(sessions);
    });
  </script>
</body>
</html>
