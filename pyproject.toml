[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trailblazer-agent"
version = "1.0.0"
description = "Verified codebase issue investigator and interactive dashboard for AI coding agents and engineers."
readme = "README.md"
authors = [{ name = "Ashrith K", email = "kothaashrith07@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "agent-skill",
    "claude-code",
    "cursor",
    "windsurf",
    "codebase-investigator",
    "code-understanding",
    "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Homepage = "https://github.com/Ashrith-2001/trailblazer"
Repository = "https://github.com/Ashrith-2001/trailblazer"
Issues = "https://github.com/Ashrith-2001/trailblazer/issues"

[project.scripts]
trailblazer = "trailblazer.compile:main"
trailblazer-mcp = "trailblazer.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trailblazer*"]

[tool.setuptools.package-data]
trailblazer = ["assets/*"]
